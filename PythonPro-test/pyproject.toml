[project]
name = "testsystem"
version = "0.3.0"
description = "生产测试、SN 追溯、低代码流程编排与 MES 上报系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
hardware = [
    "pyserial>=3.5,<4",
    "python-can>=4.4,<5",
    "pymodbus>=3.7,<4",
    "bleak>=0.22,<2",
    "paho-mqtt>=2.1,<3",
    "pylink-square>=1.4,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[project.scripts]
testsystem = "testsystem:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
